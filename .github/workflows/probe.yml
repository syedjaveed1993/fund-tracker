name: Probe holdings API

# Manual only - run it from the Actions tab, read the log, then delete this file.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe mfdata.in
        run: python scripts/probe_holdings.py
