name: Probe holdings API

# Manual only - run from the Actions tab, read the log, then delete this file.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel readers
        run: pip install openpyxl xlrd
      - name: Probe AMFI portfolio disclosures
        run: python scripts/probe_amfi.py
